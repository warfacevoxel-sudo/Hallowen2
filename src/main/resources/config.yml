# =========================================================
# Halloween Plugin v3.4.0 Config
# =========================================================
# DO NOT EDIT THIS LINE - used for auto-migration detection
config_version: "3.4.0"

# Global enable/disable is controlled via commands, not here!
#   /halloween on  - Enable Halloween globally (stored in data.yml)
#   /halloween off - Disable Halloween globally (stored in data.yml)
# Players can individually opt-out with: /halloween disable

# =========================================================
# COMMAND PREFIX SETTINGS
# =========================================================
# Command prefix (default: halloween)
# Changes BOTH the messages AND registers a working command!
# Examples: halloween, scary, spooky, hw, etc.
#
# ⚠️ IMPORTANT: When you set a custom prefix (e.g., "scary"):
# - Plugin registers /scary as the ONLY command
# - /halloween and /hlw are UNREGISTERED (freed for other plugins!)
# - This ensures ZERO conflicts with other Halloween plugins
#
# Example use case:
#   You have another Halloween plugin using /halloween
#   Set this to "scary" and this plugin will use /scary only
#   The other plugin can now freely use /halloween!
#
# How it works:
# - command_prefix: "halloween" → Uses /halloween and /hlw (default)
# - command_prefix: "scary" → Uses /scary ONLY, frees /halloween for others
#
# Restart server after changing this setting!
command_prefix: "halloween"

# Broadcast settings
broadcast_events: false  # If false, only affected player sees messages

# =========================================================
# WORLD BLACKLIST (v3.1.0+)
# =========================================================
# Worlds where Halloween events are DISABLED
# Players in blacklisted worlds will NOT experience any Halloween events
# Common use case: Disable Halloween in creative/admin worlds, nether, the_end
# Default: Multiple naming conventions supported (nether, world_nether, the_end, world_the_end)
# Note: Check your actual world names with /worldinfo - server configs vary!
worlds_blacklist:
  - nether           # Vanilla nether
  - world_nether     # Custom nether world name (Multiverse, custom servers)
  - the_end          # Vanilla the_end
  - world_the_end    # Custom the_end world name (Multiverse, custom servers)

# Player Filters (v3.3.0+)
# respect_vanish: players hidden by a vanish plugin (SuperVanish, PremiumVanish, Essentials, CMI...
#                 anything that sets the standard "vanished" metadata) get no events, buffs or rewards
#                 and are never named in boss/grave broadcasts.
# skip_spectators: players in spectator mode get no events, buffs or rewards.
player_filters:
  respect_vanish: true
  skip_spectators: true

# WorldGuard (v3.4.0+, optional) - when WorldGuard is installed the plugin registers the region flag
# "halloween-events" (allow by default). Set it to deny in a region (/rg flag <region> halloween-events deny)
# and no scare events, bosses, graves or Pumpkin Traders happen inside it.
worldguard:
  enabled: true

# =========================================================
# LOGIN & HELMET REWARDS (v3.0.0+)
# =========================================================

# Login Pumpkin Spawn
# Controls whether players receive a pumpkin helmet when joining the server
login_pumpkin:
  enabled: true  # Set to false to disable login pumpkin spawn completely
  cooldown_minutes: 30  # Minutes cooldown after login before next pumpkin

# Join Messages (v3.3.0+)
# Messages players see when they join: welcome message, the "/halloween disable|enable" hint,
# the "Halloween is globally disabled" notice and the login-pumpkin cooldown notice.
# Set enabled: false to keep the join silent (events still run). sound: false disables the spooky join sound.
login_messages:
  enabled: true
  sound: true

# =========================================================
# SEASON SCHEDULER (v3.4.0+)
# =========================================================
# Turns Halloween on when the season starts and off when it ends (checked every minute, server timezone).
# Only boundary crossings are applied, so /halloween on|off still works manually in between.
season:
  enabled: false
  start: "10-01"        # MM-DD
  end: "11-05"          # MM-DD (may be before start to wrap the new year)
  countdown_days: 7     # players joining up to N days before the start see "Halloween starts in N days" (0 = off)
  timezone: ""          # e.g. "Europe/Prague"; empty = server default

# =========================================================
# WITCHING HOUR (v3.4.0+)
# =========================================================
# A daily window in which scare events fire more often. mode: real = server clock (start/end HH:mm),
# minecraft = in-game time (minecraft_start_tick/minecraft_end_tick, 18000 = midnight).
witching_hour:
  enabled: false
  mode: real
  start: "20:00"
  end: "22:00"
  minecraft_start_tick: 18000
  minecraft_end_tick: 22000
  interval_multiplier: 0.5   # 0.5 = events twice as often
  announce: true             # broadcast witchingHourStart / witchingHourEnd
  ambient_sounds: true       # random horror sounds while active
  reschedule_on_start: true  # restart event timers when the window opens/closes so the multiplier applies at once

# =========================================================
# DISCORD WEBHOOK (v3.4.0+)
# =========================================================
# Posts boss/grave/season events to a Discord channel. Create a webhook in the channel settings and paste its URL.
discord:
  enabled: false
  webhook_url: ""
  username: "Halloween"
  events:
    boss_spawn: true
    boss_defeat: true
    grave_start: false
    grave_complete: true
    season: true
    top_players: true        # season-end leaderboard

# =========================================================
# STATISTICS (v3.4.0+)  -  stored in stats.yml, shown with /halloween stats and /halloween top
# =========================================================
# Available statistics: scares, pumpkins_received, halloween_mob_kills, bosses_spawned, bosses_defeated,
# graves_started, graves_completed, grave_mvp, cakes, candy_earned, pumpkin_time (seconds)
statistics:
  enabled: true
  player_visible:           # what a regular player sees with /halloween stats (admins see everything)
    - scares
    - pumpkins_received
    - halloween_mob_kills
    - bosses_defeated
    - graves_completed
    - cakes
    - candy_earned
  top_public: true          # may regular players use /halloween top?
  season_end_top: 3         # announce the top N players when the season ends (0 = off)
  season_end_stat: halloween_mob_kills
  # PlaceholderAPI (if installed): %halloween_<stat>%, %halloween_top_<stat>_<n>_name%, %halloween_top_<stat>_<n>_value%,
  # %halloween_season_active%, %halloween_witching_hour%

# Helmet Trick-or-Treat Rewards
# Players wearing pumpkin helmets receive cakes at progressive intervals
helmet_rewards:
  enabled: true  # Set to false to disable cake rewards completely
  first_reward_minutes: 5  # Minutes for first cake reward
  increment_minutes: 5  # Increase interval by this amount each time (3, 6, 9, 12, ...)
  max_minutes: 30  # Maximum interval between cakes

# =========================================================
# BOSS ENCOUNTERS
# =========================================================

# Pumpkin Zombie Boss
# Summon: Place fence + carved pumpkin on top, ignite with flint & steel
pumpkin_zombie_boss:
  enabled: true
  cooldown_minutes: 10  # Cooldown before same player can spawn another boss
  health: 100.0  # Boss health
  damage_boost: 2.0  # Additional damage multiplier
  speed_boost: 0.3  # Movement speed boost
  xp_reward: 10  # Levels to give on defeat
  rewards:
    - material: CARVED_PUMPKIN
      min: 15
      max: 20
    - material: CAKE
      min: 3
      max: 5
    - material: PHANTOM_MEMBRANE
      min: 1
      max: 5
    - material: ZOMBIE_HEAD
      min: 1
      max: 1
      chance: 0.3  # 30% chance
    - material: GLOWSTONE_DUST
      min: 10
      max: 32

# Pumpkin Skeleton Boss (with Minions)
# Summon: Place lapis block + carved pumpkin on top, ignite with flint & steel
pumpkin_skeleton_boss:
  enabled: true
  cooldown_minutes: 10  # Cooldown before same player can spawn another boss
  health: 100.0  # Boss health
  damage_boost: 3.0  # Additional damage
  speed_boost: 0.3  # Movement speed boost
  xp_reward: 15  # Levels to give on defeat (+40% more than zombie boss)
  bat_spawn_interval: 10  # Seconds between bat spawns
  phantom_spawn_interval: 60  # Seconds between phantom spawns
  minion_range: 20  # Range to check for existing minions
  rewards:
    - material: CARVED_PUMPKIN
      min: 15
      max: 30
    - material: PHANTOM_MEMBRANE
      min: 2
      max: 4
    - material: ANCIENT_DEBRIS
      min: 1
      max: 2
    - material: POTION
      min: 1
      max: 1
      # Potion will be Strength II by default

# =========================================================
# RANDOM FEATURES
# =========================================================
  
# Random pumpkin head mobs
random_pumpkin_mobs:
  enabled: true
  chance: 0.10  # 10% chance for any mob to spawn with pumpkin
  pumpkin_drops: 
    min: 1
    max: 3
    
# Pumpkin Trader (right-click a villager while holding a carved pumpkin)
# v3.4.0: trades are configurable. item: any material, or CANDY = the Halloween Candy item (see candy: below).
# max_uses = how many times each trade can be used per trader (vanilla trade lock).
# (daily_limit from older versions is no longer used.)
pumpkin_villager:
  enabled: true
  trades:
    - cost:   { item: EMERALD, amount: 1 }
      result: { item: CARVED_PUMPKIN, amount: 64 }
      max_uses: 999999
    - cost:   { item: CARVED_PUMPKIN, amount: 64 }
      result: { item: EMERALD, amount: 1 }
      max_uses: 999999
    - cost:   { item: CANDY, amount: 10 }
      result: { item: GOLDEN_APPLE, amount: 1 }
      max_uses: 5
    - cost:   { item: CANDY, amount: 25 }
      result: { item: DIAMOND, amount: 1 }
      max_uses: 3

# =========================================================
# VISUALS (v3.4.0+)
# =========================================================
visuals:
  boss_bar:
    enabled: true
    radius: 40          # players within this distance of a boss see its health bar (grave bars use 30)
  titles:
    enabled: true
    boss_spawn: true
    wave_start: true
    grave_complete: true

# =========================================================
# HALLOWEEN CANDY (v3.4.0+)
# =========================================================
# A tagged item (ordinary cookies don't count) that drops from Halloween mobs, bosses and graves and is
# spent at the Pumpkin Trader. Also usable in any rewards: list as "- candy: 5".
candy:
  enabled: true
  material: COOKIE
  name: "&6&lHalloween Candy"
  lore:
    - "&7Sweet loot from the spirits."
    - "&7Trade it with the Pumpkin Trader!"
  edible: false            # false = cannot be eaten (it's currency)
  drops:                   # chance 0.0-1.0, then min-max pieces
    grave_mob:          { chance: 0.25, min: 1, max: 1 }
    grave_complete:     { chance: 1.0,  min: 5, max: 10 }   # into the grave reward chest
    random_pumpkin_mob: { chance: 0.30, min: 1, max: 2 }
    boss_defeat:        { chance: 1.0,  min: 5, max: 10 }   # into the boss reward chest
    bat_witch:          { chance: 0.50, min: 1, max: 3 }

# Bat Transformation Event (v3.0.0+)
# When players kill bats, they have a chance to transform into witches
bat_transformation:
  enabled: true
  chance: 0.33  # 33% chance for bat to transform into witch on death
  health_multiplier: 1.5  # Witch has 150% normal health
  message: "§5§l✦ §dThe bat transforms into a witch! §5§l✦"
  xp_reward: 5  # XP levels for killing transformed witch
  rewards:
    pumpkins_min: 3
    pumpkins_max: 8
    potion_drop: true  # Whether to drop a random potion (Strength/Swiftness/Regen/Healing/Fire Resistance)

# =========================================================
# SCARE EVENTS (v3.0.0 - Unified Structure)
# =========================================================
# All random scare events that happen to players at intervals
# Set min and max to 0 to disable an event
# Intervals are in MINUTES

events:
  # Pumpkin Curse - Places carved pumpkin on player's head
  pumpkin:
    enabled: true
    min: 5  # Minimum minutes between events
    max: 20  # Maximum minutes between events
    enable_pumpkin_surprise: true  # If true, players get inventory filled with pumpkins after Nth pumpkin (event or login)
    pumpkin_surprise_count: 3      # Number of pumpkins required to trigger surprise (default: 3)
  
  # Slenderman - Spawns enderman briefly in front of player
  slenderman:
    enabled: true
    min: 15
    max: 40
  
  # Fire Event - Sets player on fire (harmless by default)
  fire:
    enabled: true
    min: 30
    max: 60
    damage_enabled: false  # Set to true to enable fire damage (v3.0.0+)
  
  # Lightning Event - Strikes lightning near player (harmless by default)
  lightning:
    enabled: true
    min: 20
    max: 35
    damage_enabled: false  # Set to true to enable lightning damage (v3.0.0+)
  
  # Darkness Event - Brief blindness effect with spooky sounds
  darkness:
    enabled: true
    min: 10
    max: 50
    duration_seconds: 2  # Duration of blindness effect (v3.0.0+)
  
  # Herobrine Progressive Scare Event (v1.7.0+)
  # Spawns Herobrine (Steve with white eyes) at night in 4 progressive stages
  # Stage 1: 3 chunks away | Stage 2: 2 chunks away | Stage 3: 1 chunk away
  # Stage 4: Behind player, plays horror sound, damages to 0.5 hearts
  herobrine:
    enabled: true
    min: 40  # Minimum minutes between Herobrine encounters
    max: 80  # Maximum minutes between Herobrine encounters
    render_distance: 3  # Maximum spawn distance in chunks (should match server view distance)

# =========================================================
# PUMPKIN BUFFS
# =========================================================
# Buffs applied when wearing carved pumpkin helmet
# Available effects: SPEED, HASTE, STRENGTH, REGENERATION, RESISTANCE, JUMP_BOOST,
#                    NIGHT_VISION, INVISIBILITY, FIRE_RESISTANCE, WATER_BREATHING,
#                    ABSORPTION, HEALTH_BOOST, LUCK, SLOW_FALLING
# level: 1 = Effect I, 2 = Effect II, ... (v3.3.0+; configs from older versions are converted automatically,
#        before 3.3.0 the number was 0-based)
# Duration: 15 seconds (prevents night vision blinking)

pumpkin_buffs:
  enabled: true
  glowing: true  # Makes player glow when wearing pumpkin
  duration: 15  # Duration in seconds (prevents night vision blinking, v1.7.2+)
  effects:
    - type: HASTE
      level: 2  # Effect II (1 = Effect I)
      enabled: false
    - type: SPEED
      level: 2
      enabled: true
    - type: STRENGTH
      level: 2
      enabled: false
    - type: REGENERATION
      level: 2
      enabled: true
    - type: RESISTANCE
      level: 2
      enabled: false
    - type: JUMP_BOOST
      level: 2
      enabled: false

# =========================================================
# GRAVE SYSTEM (v1.6.0+)
# =========================================================
# Build elaborate graves and summon undead armies!
# How to build: 3 planks (coffin) → 3 dirt → RIP sign → stone wall cross → candles
# Light candle with flint & steel to start the encounter

grave:
  enabled: true
  cooldown_minutes: 15  # Cooldown before same player can activate another grave
  wave_timeouts:
    wave1: 90  # 1.5 minutes to complete wave 1 (v3.0.0+)
    wave2: 120  # 2 minutes to complete wave 2 (v3.0.0+)
    wave3: 180  # 3 minutes to complete wave 3 (v3.0.0+)
  spawns:
    # Wave 1 spawns
    wave1:
      skeleton: 3
      zombie: 2
      skeleton_horse: 2
      zombie_horse: 3
    # Wave 2 spawns (harder)
    wave2:
      skeleton: 5
      zombie: 7
      skeleton_horse: 3
      zombie_horse: 4
    # Wave 3 spawns (hardest)
    wave3:
      skeleton: 10
      zombie: 8
      blaze: 3  # Replaced phantoms with blazes (v1.7.2+)
      skeleton_horse: 6
  health_boost: 1.3  # Multiply mob health by this (1.3 = 30% more health)
  damage_boost: 1.5  # Multiply mob damage by this (1.5 = 50% more damage)
  speed_boost: 0.2  # Add this to mob speed
  chest_glow:                 # v3.4.0 - glowing outline on the reward chest until it is opened
    enabled: true
    minutes: 15
  pumpkin_drop_chance: 0.10   # chance a grave mob drops pumpkins (v3.4.0 - was hardcoded 10%)
  pumpkin_drops_per_mob: 1    # how many (before 3.4.0 this key was ignored and 1 was dropped)  # Pumpkins dropped by each grave mob
  xp_per_mob: 5  # Extra XP per mob kill
  # Rewards (v3.4.0): besides "- material: X / min / max / chance" you can use
  #   - candy: 5                                   (Halloween Candy, min/max optional)
  #   - command: "give %player% cake 1"            (console command, run for every participant)
  #   - money: 100                                 (Vault economy, split by kill share)
  # "chance" works for every entry and every reward list (bosses too).
  rewards:
    - material: CARVED_PUMPKIN
      min: 10
      max: 32
    - material: CAKE
      min: 2
      max: 5
    - material: SKELETON_SKULL
      min: 0
      max: 1
      chance: 0.5  # 50% chance
    - material: ZOMBIE_HEAD
      min: 0
      max: 1
      chance: 0.5  # 50% chance
    - material: DIAMOND
      min: 5
      max: 10
    - material: ANCIENT_DEBRIS
      min: 1
      max: 3
    - material: PHANTOM_MEMBRANE
      min: 1
      max: 1

# =========================================================
# UPDATE CHECKER (v1.7.1+)
# =========================================================

update_checker:
  enabled: true  # Set to false to disable update notifications
  # Message shown to admins when update is available
  # Placeholders: %current_version%, %new_version%, %link%
  # Use %link% for clickable URL to updates page
  message: "§6[Halloween] §eNew update available!\n§7Current: §c%current_version% §7→ Latest: §a%new_version%\n§eDownload: %link%"
