# =========================================================
# Halloween Plugin - messages.yml
# =========================================================
# Every message is a list; one entry is picked at random each time.
# Colours: use & codes (&c, &l, ...) or &#RRGGBB hex colours, § codes also work.
# Placeholders are case-insensitive: %PLAYER% == %player%. Available placeholders are
# listed next to each category (%COMMAND% = the configured command name, e.g. "halloween").
# Categories you delete or leave empty fall back to the built-in English defaults.
# Since v3.3.0 ALL texts the plugin shows to players and admins are here.
# =========================================================

pumpkin:
