  - "🎃 A spooky spirit has cursed %PLAYER% with a pumpkin!"
  - "👻 Beware! %PLAYER% is now wearing the mark of Halloween."
  - "🕯️ A cursed pumpkin appeared on %PLAYER%'s head."

